version: "3.8"

services:
  memory-tavern-backend:
    build: ./backend
    container_name: memory-tavern-backend
    ports:
      - "8600:8600"
    environment:
      - POWERCONTEXT_URL=http://host.docker.internal:8000
      - POWERCONTEXT_TOKEN=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
